[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/kaj-tinamit-model/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["cuarentaydos"]
repository = "https://github.com/42Pupusas/kaj-tinamit"
rust-version = "1.85"

[workspace.dependencies]
json-bourne = { version = "0.2.1", features = ["derive"] }
# 0.3 carries the wall-clock silence budgets: stalled reads surface as a
# descriptive TimedOut instead of leaking the socket's raw EAGAIN ("os error
# 11"), and a failed reconnect can no longer desync the keep-alive stream.
xibalba-client = "0.3"
xibalba-proto = "0.2.1"
rustls-rustcrypto = "0.0.2-alpha"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "custom-provider"] }
webpki-roots = "1"
kaj-tinamit = { path = "crates/kaj-tinamit-model", version = "0.1.0" }
kaj-tinamit-http = { path = "crates/kaj-tinamit-http", version = "0.1.0" }
kaj-tinamit-client = { path = "crates/kaj-tinamit-client", version = "0.1.0" }

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Publish order: kaj-tinamit, kaj-tinamit-http, kaj-tinamit-client.
# Validate without uploading: cargo publish --workspace --dry-run

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
