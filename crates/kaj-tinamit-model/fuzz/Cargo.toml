[package]
name = "kaj-tinamit-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
json-bourne = { version = "0.3", features = ["derive"] }
kaj-tinamit = { path = ".." }

[[bin]]
name = "parse_models"
path = "fuzz_targets/parse_models.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "allow" # libfuzzer entry point uses unsafe

[workspace]
# Standalone: keep this crate out of the kaj-tinamit workspace.
