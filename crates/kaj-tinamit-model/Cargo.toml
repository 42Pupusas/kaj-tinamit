[package]
name = "kaj-tinamit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Type-safe wire models for the GitLab REST API v4."
readme = "README.md"
keywords = ["gitlab", "api", "rest", "serde", "model"]
categories = ["api-bindings", "encoding", "data-structures"]

[features]
# Adds `proptest::Arbitrary` impls to every wire model, for property tests.
# Off by default; enabled via the self dev-dependency below.
proptest = ["dep:proptest", "dep:proptest-derive"]

[dependencies]
json-bourne = { workspace = true }
proptest = { version = "1", optional = true }
proptest-derive = { version = "0.5", optional = true }

[dev-dependencies]
divan = "0.1"
# Self-dep with `proptest` on so the property tests get the Arbitrary impls
# even though the feature is off for normal builds.
kaj-tinamit = { path = ".", features = ["proptest"] }

[[bench]]
name = "parse"
harness = false
